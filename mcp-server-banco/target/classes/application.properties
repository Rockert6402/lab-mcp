spring.application.name=mcp-server-banco

# --- MCP por STDIO ---
spring.ai.mcp.server.name=bank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.main.web-application-type=none
spring.main.banner-mode=off

# IMPORTANTE: en STDIO solo puede salir JSON-RPC por stdout; los logs van a archivo
logging.threshold.console=OFF
logging.file.name=${user.home}/mcp-logs/mcp-server-banco.log

# --- Base de datos (credenciales por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_mcp?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# show-sql escribe en stdout y rompería el protocolo: debe quedar en false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Reglas de negocio ---
bank.loan.annual-rate=0.18
bank.loan.max-amount=50000000
bank.loan.max-payment-ratio=0.40
bank.seed-demo-data=true

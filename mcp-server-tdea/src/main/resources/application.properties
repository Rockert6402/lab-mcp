spring.application.name=mcp-server-tdea
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=shopping-list-mcp-server
spring.ai.mcp.server.version=1.0.0
# STDIO: nada puede escribirse en stdout salvo los mensajes JSON-RPC
spring.ai.mcp.server.stdio=true
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.threshold.console=OFF
logging.file.name=${user.home}/mcp-logs/mcp-server-tdea.log
